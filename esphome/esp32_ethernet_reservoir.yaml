substitutions:
  name: "hydrocontrol-esp32-ethernet"
  friendly_name: "HydroControl ESP32 Ethernet Node"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-poe
  framework:
    type: esp-idf

# Wired Ethernet Configuration (LAN8720 / Olimex / WT32-ETH01)
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO17_OUT
  phy_addr: 0
  power_pin: GPIO12

api:
  encryption:
    key: "!secret api_encryption_key"

ota:
  - platform: esphome

# Bluetooth Proxy still works concurrently with Ethernet on ESP32!
bluetooth_proxy:
  active: true

i2c:
  sda: GPIO13
  scl: GPIO16
  scan: true

one_wire:
  - platform: gpio
    pin: GPIO4
    id: dallas_bus

sensor:
  # Water Temperature (Dallas DS18B20)
  - platform: dallas_temp
    one_wire_id: dallas_bus
    name: "Reservoir Water Temperature"
    id: reservoir_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s

  # Ultrasonic Water Level
  - platform: ultrasonic
    trigger_pin: GPIO5
    echo_pin: GPIO36
    name: "Reservoir Water Depth"
    id: reservoir_water_depth
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    update_interval: 5s

  # ADS1115 for pH & EC probes
  - platform: ads1115
    i2c_id: i2c
    multiplexer: 'A0_GND'
    gain: 4.096
    name: "Raw pH Probe Voltage"
    id: ph_voltage
    update_interval: 5s

  - platform: template
    name: "Reservoir pH"
    id: reservoir_ph
    unit_of_measurement: "pH"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      float voltage = id(ph_voltage).state;
      return (-5.70 * voltage) + 21.34;

  - platform: ads1115
    i2c_id: i2c
    multiplexer: 'A1_GND'
    gain: 4.096
    name: "Raw EC Probe Voltage"
    id: ec_voltage
    update_interval: 5s

  - platform: template
    name: "Reservoir EC"
    id: reservoir_ec
    unit_of_measurement: "mS/cm"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      float voltage = id(ec_voltage).state;
      return voltage * 1.45;

switch:
  - platform: gpio
    pin: GPIO2
    name: "Pump pH Down"
    id: pump_ph_down

  - platform: gpio
    pin: GPIO14
    name: "Pump pH Up"
    id: pump_ph_up

  - platform: gpio
    pin: GPIO15
    name: "Pump Nutrients Part A"
    id: pump_nutrients_a

  - platform: gpio
    pin: GPIO32
    name: "Pump Nutrients Part B"
    id: pump_nutrients_b

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO34
      mode: INPUT
    name: "Reservoir High Float"
    id: float_high

  - platform: gpio
    pin:
      number: GPIO35
      mode: INPUT
    name: "Reservoir Low Float"
    id: float_low
