substitutions:
  name: "hydrocontrol-esp32-wifi"
  friendly_name: "HydroControl ESP32 Wi-Fi Node"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable Home Assistant native API & OTA updates
api:
  encryption:
    key: "!secret api_encryption_key"

ota:
  - platform: esphome

wifi:
  ssid: "!secret wifi_ssid"
  password: "!secret wifi_password"
  ap:
    ssid: "HydroControl-Fallback"
    password: "setup-hydrocontrol"

captive_portal:

# Bluetooth Proxy (track BLE plant sensors, Xiaomi floral sensors, RuuviTags)
bluetooth_proxy:
  active: true

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

one_wire:
  - platform: gpio
    pin: GPIO4
    id: dallas_bus

sensor:
  # 1. Reservoir Water Temperature (Dallas DS18B20)
  - platform: dallas_temp
    one_wire_id: dallas_bus
    name: "Reservoir Water Temperature"
    id: reservoir_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s

  # 2. Waterproof Ultrasonic Water Level (JSN-SR04T / RCWL-1601)
  - platform: ultrasonic
    trigger_pin: GPIO5
    echo_pin: GPIO18
    name: "Reservoir Water Depth"
    id: reservoir_water_depth
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    update_interval: 5s
    filters:
      - median:
          window_size: 5
          send_every: 2
      - filter_out: nan

  # 3. High-Precision Analog ADC (ADS1115 for pH & EC probes)
  - platform: ads1115
    i2c_id: i2c
    multiplexer: 'A0_GND'
    gain: 4.096
    name: "Raw pH Probe Voltage"
    id: ph_voltage
    update_interval: 5s

  # Calibrated pH value calculated on device
  - platform: template
    name: "Reservoir pH"
    id: reservoir_ph
    unit_of_measurement: "pH"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      // Two-point calibration formula: pH = slope * V + intercept
      float voltage = id(ph_voltage).state;
      return (-5.70 * voltage) + 21.34;

  # 4. Raw EC / Nutrient probe
  - platform: ads1115
    i2c_id: i2c
    multiplexer: 'A1_GND'
    gain: 4.096
    name: "Raw EC Probe Voltage"
    id: ec_voltage
    update_interval: 5s

  - platform: template
    name: "Reservoir EC"
    id: reservoir_ec
    unit_of_measurement: "mS/cm"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      float voltage = id(ec_voltage).state;
      return voltage * 1.45; // Calibrated EC conversion factor

switch:
  # Actuators (Relays / MOSFETs for 12V Peristaltic Pumps)
  - platform: gpio
    pin: GPIO25
    name: "Pump pH Down"
    id: pump_ph_down
    icon: "mdi:eyedropper-minus"

  - platform: gpio
    pin: GPIO26
    name: "Pump pH Up"
    id: pump_ph_up
    icon: "mdi:eyedropper-plus"

  - platform: gpio
    pin: GPIO27
    name: "Pump Nutrients Part A"
    id: pump_nutrients_a
    icon: "mdi:bottle-tonic-plus"

  - platform: gpio
    pin: GPIO14
    name: "Pump Nutrients Part B"
    id: pump_nutrients_b
    icon: "mdi:bottle-tonic"

  - platform: gpio
    pin: GPIO12
    name: "Main Irrigation Circulation Pump"
    id: pump_irrigation
    icon: "mdi:pump"

binary_sensor:
  # Digital Liquid Float Sensors for Physical Overflow/Empty Safeguards
  - platform: gpio
    pin:
      number: GPIO32
      mode: INPUT_PULLUP
      inverted: true
    name: "Reservoir High Float (Overflow Guard)"
    id: float_high

  - platform: gpio
    pin:
      number: GPIO33
      mode: INPUT_PULLUP
      inverted: true
    name: "Reservoir Low Float (Dry Run Guard)"
    id: float_low
